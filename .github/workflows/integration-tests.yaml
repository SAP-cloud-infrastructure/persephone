# This workflow is NOT autogenerated by go-makefile-maker. It runs
# integration tests that require envtest (etcd + kube-apiserver binaries)
# and are excluded from the standard CI test job.

name: Integration Tests
"on":
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          go-version: 1.27.1
      - name: Run integration tests
        env:
          GOTOOLCHAIN: go1.27.0
        run: |
          export PATH="${GOPATH}/bin:${PATH}"
          make test-integration
