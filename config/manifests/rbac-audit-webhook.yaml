apiVersion: v1
kind: ServiceAccount
metadata:
  name: persephone-audit-webhook
  namespace: garden
  labels:
    app: persephone
    role: audit-webhook

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: persephone-audit-webhook
  namespace: garden
  labels:
    app: persephone
    role: audit-webhook
rules:
- apiGroups: [""]
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups: [""]
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: persephone-audit-webhook
  namespace: garden
  labels:
    app: persephone
    role: audit-webhook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: persephone-audit-webhook
subjects:
- kind: ServiceAccount
  name: persephone-audit-webhook
  namespace: garden
