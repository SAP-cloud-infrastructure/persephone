---
apiVersion: v1
kind: Secret
metadata:
  name: persephone-docs
  namespace: garden
type: Opaque
stringData:
  resources.yaml: |
    ---
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: scikube-getting-started-markdown
      namespace: gardener-system-public
    data:
      README.md: |
        For managing your clusters with kubectl, install the [scikube CLI](https://help.sap.com/docs/SAP_Cloud_Infrastructure/211d912d4628463eade2317696c1b036/e936cc4e21e24a5e8be5b9c1eaac8e7a.html) utility:

        ```sh
        # Install via Homebrew (macOS)
        brew tap sap-cloud-infrastructure/tap
        brew install sap-cloud-infrastructure/tap/scikube
        ```

        Then source your OpenStack credentials and generate a garden kubeconfig:

        ```sh
        source "<your-openstack-rc-file.sh>"
        # Create garden kubeconfig
        scikube kubeconfig-for-garden --landscape <landscape> > kubeconfig-for-garden.yaml
        # List clusters in your project
        KUBECONFIG=kubeconfig-for-garden.yaml kubectl get shoot
        # Connect to a cluster
        KUBECONFIG=kubeconfig-for-garden.yaml scikube kubeconfig-for-shoot --name <cluster-name> > kubeconfig-for-shoot.yaml
        KUBECONFIG=kubeconfig-for-shoot.yaml kubectl get nodes
        ```

        For detailed instructions including binary installation and cluster management, see the [Persephone documentation](https://help.sap.com/docs/SAP_Cloud_Infrastructure/211d912d4628463eade2317696c1b036/d8d7ae89e5dd4386afde7e367104d3a8.html).
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: read-scikube-getting-started-markdown
      namespace: gardener-system-public
    rules:
    - apiGroups:
      - ""
      resources:
      - configmaps
      resourceNames:
      - scikube-getting-started-markdown
      verbs:
      - get
      - list
      - watch
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: read-scikube-getting-started-markdown
      namespace: gardener-system-public
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: read-scikube-getting-started-markdown
    subjects:
    - apiGroup: rbac.authorization.k8s.io
      kind: Group
      name: system:authenticated
---
apiVersion: resources.gardener.cloud/v1alpha1
kind: ManagedResource
metadata:
  name: persephone-docs
  namespace: garden
spec:
  secretRefs:
  - name: persephone-docs

