apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: persephone-operator
  namespace: garden
  labels:
    app: persephone
    role: operator
    plugin: kube-monitoring
spec:
  selector:
    matchLabels:
      app: persephone
      role: operator
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 15s
      path: /metrics
      scheme: http
