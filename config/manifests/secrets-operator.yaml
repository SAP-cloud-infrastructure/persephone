apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: persephone-operator-token
  namespace: garden
  labels:
    resources.gardener.cloud/purpose: token-requestor
    resources.gardener.cloud/class: shoot
  annotations:
    serviceaccount.resources.gardener.cloud/name: persephone-operator
    serviceaccount.resources.gardener.cloud/namespace: garden
    serviceaccount.resources.gardener.cloud/inject-ca-bundle: "true"

---

apiVersion: v1
kind: Secret
metadata:
  name: persephone-managedresource-rbac-operator
  namespace: garden
type: Opaque
stringData:
  clusterrole.yaml: |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRole
    metadata:
      name: persephone-operator
      labels:
        app: persephone
        role: operator
    rules:
    - apiGroups: [""]
      resources:
      - namespaces
      - secrets
      - events
      - resourcequotas
      - configmaps
      verbs:
      - "*"
    - apiGroups:
      - rbac.authorization.k8s.io
      resources:
      - role
      - rolebindings
      verbs:
      - "*"
    - apiGroups:
      - core.gardener.cloud
      resources:
      - projects
      verbs:
      - create
      - get
      - list
      - watch
      - patch
      - update
    - apiGroups:
      - rbac.authorization.k8s.io
      resources:
      - roles
      - rolebindings
      verbs:
      - create
      - get
      - list
      - watch
      - patch
      - update
    - apiGroups:
      - core.gardener.cloud
      resources:
      - shoots
      - internalsecrets
      verbs:
      - "*"
    - apiGroups:
      - core.gardener.cloud
      resources:
      - shoots/adminkubeconfig
      verbs:
      - create
    - apiGroups:
      - coordination.k8s.io
      resources:
      - leases
      verbs:
      - create
      - list
      - watch
    - apiGroups:
      - coordination.k8s.io
      resources:
      - leases
      resourceNames:
      - persephone-operator-leader-election
      verbs:
      - get
      - update
      - patch
    - apiGroups:
      - security.gardener.cloud
      resources:
      - credentialsbindings
      verbs:
      - "*"

  clusterrolebinding.yaml: |
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: persephone-operator
      labels:
        app: persephone
        role: operator
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: persephone-operator
    subjects:
    - kind: ServiceAccount
      name: persephone-operator
      namespace: garden
