---
apiVersion: v1
kind: Secret
metadata:
  name: persephone-auditlog-extension
  namespace: garden
type: Opaque
stringData:
  extension.yaml: |
    ---
    apiVersion: operator.gardener.cloud/v1alpha1
    kind: Extension
    metadata:
      name: persephone-auditlog
    spec:
      resources:
        - kind: Extension
          type: persephone-auditlog
      deployment:
        extension:
          helm:
            ociRepository:
              ref: keppel.global.cloud.sap/gardener-dev/persephone-auditlog:0.1.0
          policy: OnDemand
---
apiVersion: resources.gardener.cloud/v1alpha1
kind: ManagedResource
metadata:
  name: persephone-auditlog-extension
  namespace: garden
spec:
  secretRefs:
    - name: persephone-auditlog-extension
  keepObjects: false
