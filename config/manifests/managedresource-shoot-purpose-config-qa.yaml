---
apiVersion: v1
kind: Secret
metadata:
  name: shoot-purpose-config-qa
  namespace: garden
type: Opaque
stringData:
  resources.yaml: |
    ---
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: shoot-purpose-config
      namespace: gardener-system-public
    data:
      shoot-purpose.json: |
        {
          "options": [
            { "value": "production",  "label": "Production" },
            { "value": "development", "label": "Development" },
            { "value": "evaluation",  "label": "Evaluation" },
            { "value": "testing",     "label": "Testing" }
          ],
          "default": "testing",
          "hint": "No monitoring stack is deployed for shoots with purpose 'testing'."
        }
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: read-shoot-purpose-config
      namespace: gardener-system-public
    rules:
    - apiGroups:
      - ""
      resources:
      - configmaps
      resourceNames:
      - shoot-purpose-config
      verbs:
      - get
      - list
      - watch
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: read-shoot-purpose-config
      namespace: gardener-system-public
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: read-shoot-purpose-config
    subjects:
    - apiGroup: rbac.authorization.k8s.io
      kind: Group
      name: system:authenticated
---
apiVersion: resources.gardener.cloud/v1alpha1
kind: ManagedResource
metadata:
  name: shoot-purpose-config-qa
  namespace: garden
spec:
  secretRefs:
  - name: shoot-purpose-config-qa
