image:
  repository: keppel.eu-de-1.cloud.sap/ccloud/persephone/persephone-auditlog
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 64Mi

healthPort: 8081
metricsPort: 8080

# s3Endpoint is the Ceph RadosGW S3 endpoint URL.
# Pattern: https://rgw.st1.<region>.cloud.sap
# Example: https://rgw.st1.eu-de-1.cloud.sap
s3Endpoint: ""
