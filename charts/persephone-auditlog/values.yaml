image:
  repository: keppel.global.cloud.sap/ccloud/persephone/persephone-auditlog
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 64Mi

healthPort: 8081
metricsPort: 8080

# s3EndpointTemplate builds the Ceph S3 endpoint URL per shoot.
# "{region}" is replaced with the shoot's region at reconcile time.
# Override in the ControllerDeployment Helm values for your landscape.
# Example: "https://rgw.st1.{region}.cloud.sap"
s3EndpointTemplate: ""
