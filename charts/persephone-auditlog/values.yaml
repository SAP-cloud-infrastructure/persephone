image:
  repository: keppel.eu-de-1.cloud.sap/ccloud/persephone/persephone-auditlog
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 64Mi

healthPort: 8081
metricsPort: 8080

# s3EndpointTemplate is used to build the Ceph S3 endpoint URL per shoot.
# "{region}" is replaced with the shoot's region at reconcile time.
s3EndpointTemplate: "https://rgw.st1.{region}.cloud.sap"
